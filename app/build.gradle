plugins { id 'com.android.application' }
def configured = { String key -> (project.findProperty(key) ?: System.getenv(key) ?: '').toString() }
def quoted = { String value -> '"' + value.replace('\\','\\\\').replace('"','\\"') + '"' }
def apiBase = configured('CALLGUARD_API_BASE')
def googleClientId = configured('CALLGUARD_GOOGLE_CLIENT_ID')
if (configured('CALLGUARD_COMMERCIAL') == 'true' && !apiBase.startsWith('https://')) throw new GradleException('Commercial builds require a configured HTTPS API')
android {
    namespace 'com.callguard'
    compileSdk 36
    buildFeatures { buildConfig true; aidl false }
    defaultConfig {
        applicationId 'com.callguard.mobile'
        minSdk 26
        targetSdk 36
        versionCode = (project.findProperty('CALLGUARD_VERSION_CODE') ?: '134').toInteger()
        versionName = (project.findProperty('CALLGUARD_VERSION_NAME') ?: '1.1.24-preview')
        buildConfigField 'String', 'API_BASE', quoted(apiBase)
        buildConfigField 'String', 'GOOGLE_CLIENT_ID', quoted(googleClientId)
        buildConfigField 'boolean', 'COMMERCIAL_ENABLED', (configured('CALLGUARD_COMMERCIAL') == 'true').toString()
        buildConfigField 'String', 'PRO_PRODUCT_ID', '"callguard_pro_lifetime"'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    signingConfigs {
        distribution {
            storeFile rootProject.file(configured('CALLGUARD_KEYSTORE') ?: '.ci-signing/callguard-final.keystore')
            storePassword (configured('CALLGUARD_STORE_PASSWORD') ?: 'android')
            keyAlias (configured('CALLGUARD_KEY_ALIAS') ?: 'androiddebugkey')
            keyPassword (configured('CALLGUARD_KEY_PASSWORD') ?: 'android')
        }
    }
    buildTypes { release { signingConfig signingConfigs.distribution; minifyEnabled false } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    testOptions { animationsDisabled true }
}
dependencies {
    implementation project(':adb-transport')
    implementation 'org.bouncycastle:bcpkix-jdk15to18:1.84'
    implementation 'com.google.android.gms:play-services-auth:21.3.0'
    implementation 'com.android.billingclient:billing:8.1.0'
    implementation 'androidx.credentials:credentials:1.3.0'
    implementation 'androidx.credentials:credentials-play-services-auth:1.3.0'
    implementation 'com.google.android.libraries.identity.googleid:googleid:1.1.1'
    implementation 'androidx.work:work-runtime:2.10.1'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test:rules:1.6.1'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
}
