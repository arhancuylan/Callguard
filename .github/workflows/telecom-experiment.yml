name: Telecom experiment APK
on:
  push:
    branches: [telecom-experiment]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Restore the explicit experimental signing key
        id: signing-key
        uses: actions/cache/restore@v4
        with:
          path: .ci-signing/telecom-test.keystore
          key: telecom-test-signing-v2
      - name: Create experimental signing key only if missing
        run: |
          mkdir -p .ci-signing
          if [ ! -f .ci-signing/telecom-test.keystore ]; then
            keytool -genkeypair -keystore .ci-signing/telecom-test.keystore -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 3650 -dname "CN=CallGuard Experimental,O=Android,C=TR"
          fi
      - name: Save the experimental signing key
        if: steps.signing-key.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .ci-signing/telecom-test.keystore
          key: telecom-test-signing-v2
      - name: Test, lint and compile the experiment
        run: |
          gradle --no-daemon :probe:testDebugUnitTest :probe:lintDebug :probe:assembleDebug || { cat probe/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt 2>/dev/null; exit 1; }
      - name: Prepare diagnostic APK
        run: cp probe/build/outputs/apk/debug/probe-debug.apk CallGuard-Telecom-Test.apk
      - uses: actions/upload-artifact@v4
        with:
          name: CallGuard-Telecom-Test
          path: CallGuard-Telecom-Test.apk
          retention-days: 14
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Telecom-test-reports
          path: |
            probe/build/reports/tests/
            probe/build/reports/lint-results-debug.*
          retention-days: 14
