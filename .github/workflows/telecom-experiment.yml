name: Telecom experiment APK
on:
  push:
    branches: [telecom-experiment]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Preserve the experimental debug signing key for subsequent test builds
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: telecom-experiment-debug-key-v1
      - name: Test, lint and compile the experiment
        run: |
          gradle --no-daemon :probe:testDebugUnitTest :probe:lintDebug :probe:assembleDebug || { cat probe/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt 2>/dev/null; exit 1; }
      - name: Prepare diagnostic APK
        run: cp probe/build/outputs/apk/debug/probe-debug.apk CallGuard-Telecom-Test.apk
      - uses: actions/upload-artifact@v4
        with:
          name: CallGuard-Telecom-Test
          path: CallGuard-Telecom-Test.apk
          retention-days: 14
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Telecom-test-reports
          path: |
            probe/build/reports/tests/
            probe/build/reports/lint-results-debug.*
          retention-days: 14
