name: Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Check project structure
        run: python3 tools/check_structure.py
      - name: Build and lint debug APK
        run: gradle --no-daemon assembleDebug lintDebug
      - name: Prepare APK
        run: cp app/build/outputs/apk/debug/app-debug.apk CallGuard-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: CallGuard-debug
          path: CallGuard-debug.apk
          if-no-files-found: error
      - name: Publish downloadable test APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}" CallGuard-debug.apk --title "CallGuard test APK #${{ github.run_number }}" --notes "Otomatik derlenmiş debug test APK. WhatsApp uyumluluğu gerçek cihazda doğrulanmalıdır. Sessizce yok say modu zil sesini susturmaz." --target "$GITHUB_SHA" --latest
