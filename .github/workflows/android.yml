name: CallGuard final APK and end-to-end tests
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: callguard-final
  cancel-in-progress: false
jobs:
  build-test-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Restore the established signing key
        id: signing
        uses: actions/cache/restore@v4
        with:
          path: .ci-signing/telecom-test.keystore
          key: telecom-test-signing-v2
          fail-on-cache-miss: true
      - name: Unit tests, lint and APK builds
        run: |
          gradle --no-daemon :app:testDebugUnitTest :app:lintDebug :app:lintRelease :app:assembleRelease :app:assembleDebug :app:assembleDebugAndroidTest :fixture:assembleDebug || { cat app/build/intermediates/lint_intermediate_text_report/*/*/*.txt 2>/dev/null; exit 1; }
      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android 35 end-to-end tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -memory 2048
          disable-animations: true
          script: bash tools/device-tests.sh
      - name: Upload test evidence and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CallGuard-test-evidence
          path: |
            app/build/reports/
            evidence/
          retention-days: 30
      - name: Prepare verified APK
        run: |
          cp app/build/outputs/apk/release/app-release.apk CallGuard-1.0.0.apk
          sha256sum CallGuard-1.0.0.apk > CallGuard-1.0.0.apk.sha256
          $ANDROID_HOME/build-tools/35.0.0/apksigner verify --verbose CallGuard-1.0.0.apk
          unzip -l CallGuard-1.0.0.apk | head -25
      - uses: actions/upload-artifact@v4
        with:
          name: CallGuard-1.0.0
          path: |
            CallGuard-1.0.0.apk
            CallGuard-1.0.0.apk.sha256
      - name: Publish final APK only after all tests pass
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v1.0.0-build.${{ github.run_number }}" CallGuard-1.0.0.apk CallGuard-1.0.0.apk.sha256 --title "CallGuard 1.0.0 · by AC" --notes-file RELEASE_NOTES.md --target "$GITHUB_SHA" --latest
