name: CallGuard final APK and end-to-end tests
on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "fixture/**"
      - "build.gradle"
      - "settings.gradle"
      - "gradle.properties"
      - "tools/device-tests.sh"
      - "tools/contact-picker-check.sh"
      - "tools/release-smoke.py"
  workflow_dispatch:
    inputs:
      run_device_tests:
        description: Run extended Android emulator tests
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: callguard-final
  cancel-in-progress: true
jobs:
  build-test-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 platforms;android-36 build-tools;35.0.0 build-tools;36.0.0
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Restore the final app signing key
        id: signing
        uses: actions/cache/restore@v4
        with:
          path: .ci-signing/callguard-final.keystore
          key: callguard-final-signing-v1
      - name: Initialize signing for the new application ID only once
        if: steps.signing.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          existing=$(gh release list --json tagName --jq '.[] | select(.tagName | startswith("v1.")) | .tagName')
          if [ -n "$existing" ]; then echo 'Existing final releases found; refusing to rotate the signing key.'; exit 1; fi
          mkdir -p .ci-signing
          keytool -genkeypair -keystore .ci-signing/callguard-final.keystore -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 3072 -validity 10000 -dname "CN=CallGuard by AC,O=CallGuard,C=TR"
      - name: Preserve the final app signing key
        if: steps.signing.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .ci-signing/callguard-final.keystore
          key: callguard-final-signing-v1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fast backend policy checks
        run: |
          python tools/check_structure.py
          node --check backend/functions/server.mjs
          node --test backend/functions/test/*.test.mjs
      - name: Unit tests, lint and APK builds
        env:
          CALLGUARD_API_BASE: https://mktech.net.tr/callguard
          CALLGUARD_GOOGLE_CLIENT_ID: 169220010049-rgo9tkv3usis6sl7orp68v51r8ms6viv.apps.googleusercontent.com
          CALLGUARD_COMMERCIAL: 'false'
        id: build
        run: |
          gradle --no-daemon :app:testDebugUnitTest :app:lintRelease :app:assembleRelease :app:bundleRelease || { cat app/build/intermediates/lint_intermediate_text_report/*/*/*.txt 2>/dev/null; exit 1; }
          python tools/play-preflight.py app/build/outputs/apk/release/app-release.apk
          if [ "${{ github.event_name }}" = workflow_dispatch ] && [ "${{ inputs.run_device_tests }}" = true ]; then gradle --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest :fixture:assembleDebug; fi
      - name: Enable KVM for the emulator
        if: github.event_name == 'workflow_dispatch' && inputs.run_device_tests
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android 35 end-to-end tests
        if: github.event_name == 'workflow_dispatch' && inputs.run_device_tests
        timeout-minutes: 12
        uses: reactivecircus/android-emulator-runner@v2
        with:
          emulator-boot-timeout: 180
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -memory 2048
          disable-animations: true
          script: bash tools/device-tests.sh
      - name: Verify contact picking in both lists and capture the updated screens
        if: github.event_name == 'workflow_dispatch' && inputs.run_device_tests
        uses: reactivecircus/android-emulator-runner@v2
        timeout-minutes: 6
        with:
          emulator-boot-timeout: 180
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -memory 2048
          disable-animations: true
          script: bash tools/contact-picker-check.sh
      - name: Upload test evidence and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CallGuard-test-evidence
          path: |
            app/build/reports/
            evidence/
          retention-days: 30
      - name: Prepare verified APK
        env:
          GH_TOKEN: ${{ github.token }}
        if: always() && steps.build.conclusion == 'success'
        run: |
          cp app/build/outputs/apk/release/app-release.apk CallGuard-1.1.15-preview.apk
          cp app/build/outputs/bundle/release/app-release.aab CallGuard-1.1.15-preview.aab
          sha256sum CallGuard-1.1.15-preview.apk > CallGuard-1.1.15-preview.apk.sha256
          $ANDROID_HOME/build-tools/35.0.0/apksigner verify --verbose CallGuard-1.1.15-preview.apk
          gh release download v1.0.0 --pattern CallGuard-1.0.0.apk --dir previous
          signer="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          previous_cert=$("$signer" verify --print-certs previous/CallGuard-1.0.0.apk | sed -n '/Signer #1 certificate SHA-256 digest:/p')
          current_cert=$("$signer" verify --print-certs CallGuard-1.1.15-preview.apk | sed -n '/Signer #1 certificate SHA-256 digest:/p')
          test -n "$previous_cert"
          test "$previous_cert" = "$current_cert"
          echo 'Update signing certificate matches version 1.0.0.' 
      - uses: actions/upload-artifact@v4
        if: always() && steps.build.conclusion == 'success'
        with:
          name: CallGuard-1.1.15-preview
          path: |
            CallGuard-1.1.15-preview.apk
            CallGuard-1.1.15-preview.apk.sha256
            CallGuard-1.1.15-preview.aab
      - name: Publish APK after required checks; call integration can be validated on the phone
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -m zipfile -c CallGuard-Play-Preparation.zip distribution/play tools/play-preflight.py
          gh release create "v1.1.15-preview" CallGuard-1.1.15-preview.apk CallGuard-1.1.15-preview.apk.sha256 CallGuard-1.1.15-preview.aab CallGuard-Play-Preparation.zip --title "CallGuard 1.1.15-preview · by AC" --notes-file RELEASE_NOTES.md --target "$GITHUB_SHA" --prerelease --latest=false
