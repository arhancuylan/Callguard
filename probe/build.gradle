plugins { id 'com.android.application' }
android {
    namespace 'com.callguard.telecomtest'
    compileSdk 35
    defaultConfig {
        applicationId 'com.callguard.telecomtest'
        minSdk 33
        targetSdk 35
        versionCode 6
        versionName '0.2.5-experiment'
    }
    signingConfigs {
        diagnostic {
            storeFile rootProject.file('.ci-signing/telecom-test.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes { debug { signingConfig signingConfigs.diagnostic } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies { testImplementation 'junit:junit:4.13.2' }
